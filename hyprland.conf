# ────────────────────────────────────────────────────────────
# Custom Theme for Hyprland
# Made with Omarchist
# ────────────────────────────────────────────────────────────

general {
    col.active_border = rgba(4A0E1Aee) rgba(0A0000ee) 45deg
    col.inactive_border = rgb(0A0000)
    border_size = 2
    gaps_in = 3
    gaps_out = 3
}

group {
    col.border_active = rgba(4A0E1Aee) rgba(0A0000ee) 45deg
    col.border_inactive = rgb(0A0000)

    groupbar {
        col.active = rgba(4A0E1A99)
        col.inactive = rgba(4D574E88)
        text_color = rgb(DC143C)
        text_color_inactive = rgba(E0D4C2ff)
    }
}

decoration {
    rounding = 0
     shadow {
  enabled = yes
  render_power = 16
  range = 8
  color = rgba(0,0,0, 0.8)
  }
}
